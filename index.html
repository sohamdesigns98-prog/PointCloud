<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Garden of Memories — Sydney Opera House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/chrome/chrome.css" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/leave/leave.css" />
    <link rel="stylesheet" href="/src/screens/screens.css" />
  </head>
  <body>
    <div id="app" class="is-opener-mode">
      <canvas id="garden"></canvas>

      <button
        type="button"
        class="app-back-btn chrome-hidden"
        id="btn-app-back"
        aria-label="Back"
        hidden
      >
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
          <path
            d="M14.5 6.5L9 12l5.5 5.5"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <p class="brand chrome-hidden" id="brand">Garden of Memories</p>

      <div class="map-chrome chrome-hidden" id="map-chrome">
        <div class="map-enter-wrap" id="map-hover" hidden>
          <button type="button" class="map-enter">
            <span class="map-enter-title">Sydney Opera House</span>
          </button>
          <span class="map-enter-cue">Click to enter</span>
        </div>
        <button type="button" class="map-pass-btn" id="btn-map-pass">
          Make your pass
        </button>
      </div>

      <div class="chrome-tr chrome-hidden" id="chrome-tr">
        <button
          type="button"
          class="bookmark-toggle"
          id="btn-saved"
          aria-label="Saved memories"
          hidden
        >
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
            <path
              d="M7 4.75h10A1.25 1.25 0 0 1 18.25 6v13.1l-5.4-3.35a1.5 1.5 0 0 0-1.7 0L5.75 19.1V6A1.25 1.25 0 0 1 7 4.75z"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button
          type="button"
          class="help-toggle"
          id="btn-map-walkthrough"
          aria-label="Tips"
          hidden
        >
          ?
        </button>
        <button
          type="button"
          class="ambience-toggle"
          id="ambience-toggle"
          aria-label="Mute music"
          aria-pressed="false"
        >
          <span class="ambience-toggle-icon ambience-toggle-icon--on" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
              <path
                d="M4 10v4h3l4 3V7L7 10H4z"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linejoin="round"
              />
              <path
                d="M15 9.5c1.2.9 1.9 2.1 1.9 3.5s-.7 2.6-1.9 3.5"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
              <path
                d="M17.5 7c1.9 1.4 3 3.3 3 5.5s-1.1 4.1-3 5.5"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span class="ambience-toggle-icon ambience-toggle-icon--off" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
              <path
                d="M4 10v4h3l4 3V7L7 10H4z"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linejoin="round"
              />
              <path
                d="M16 9l5 6M21 9l-5 6"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
          </span>
        </button>
      </div>

      <nav class="dock chrome-hidden" id="dock" aria-label="Garden actions">
        <button type="button" class="pill pill--dock" id="btn-add-memory" hidden>
          Add your memory
        </button>
        <button type="button" class="pill pill--dock" id="btn-pass" hidden>
          Memory Pass
        </button>
      </nav>

      <label class="emotion-filters chrome-hidden" id="emotion-filters" hidden>
        <span class="visually-hidden">Filter by feeling</span>
        <select id="emotion-filter-select" class="emotion-select" aria-label="Filter by feeling">
          <option value="All">All feelings</option>
          <option value="Love">Love</option>
          <option value="Nostalgia">Nostalgia</option>
          <option value="Joy">Joy</option>
          <option value="Wonder">Wonder</option>
          <option value="Pain">Pain</option>
        </select>
      </label>

      <footer class="garden-footer chrome-hidden" id="garden-footer">
        <h1 class="place">Sydney Opera House</h1>
        <div class="focus-title" id="focus-title" hidden>
          <p class="focus-title-text" id="focus-title-text"></p>
        </div>
        <p class="count" id="memory-count">memories live here</p>
        <p class="hint" id="hint" data-coach>
          Brush the sails. Tap a glow to read a memory. Filter by feeling anytime.
          When you’re ready, add one of your own.
        </p>
        <p class="arrival-note" id="arrival-note" hidden></p>
      </footer>

      <div class="memory-sheet" id="memory-sheet" hidden>
        <button
          type="button"
          class="memory-sheet-scrim"
          id="memory-sheet-scrim"
          aria-label="Close memory"
        ></button>
        <aside
          class="memory-panel"
          id="memory-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="memory-title"
        >
          <div class="memory-panel-glow" aria-hidden="true"></div>
          <header class="memory-panel-head">
            <span class="memory-panel-mark" aria-hidden="true">◇</span>
            <div class="memory-panel-meta">
              <p class="memory-title" id="memory-title"></p>
              <p class="relationship" id="memory-relationship"></p>
              <p class="memory-left-by" id="memory-left-by" hidden></p>
            </div>
          </header>
          <p class="body" id="memory-body"></p>
          <audio class="memory-audio" id="memory-audio" controls hidden></audio>
          <div class="memory-panel-actions">
            <button type="button" class="pill save-memory" id="btn-save-memory">
              Save
            </button>
            <button type="button" class="pill dismiss" id="memory-dismiss">
              Close
            </button>
          </div>
        </aside>
      </div>

      <aside class="saved-panel" id="saved-panel" hidden>
        <header class="saved-panel-head">
          <h2 class="saved-panel-title">Saved</h2>
          <button type="button" class="pill dismiss" id="btn-saved-close">
            Close
          </button>
        </header>
        <p class="saved-empty" id="saved-empty">No saved memories yet</p>
        <ul class="saved-list" id="saved-list"></ul>
      </aside>

      <p class="look-prompt" id="look-prompt" hidden>
        Look towards the steps.
      </p>

      <div id="shell-mount"></div>
      <div id="leave-mount"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
